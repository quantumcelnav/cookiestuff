  <!-- Chocolate chips -->
  <ellipse cx="15" cy="21" rx="3.2" ry="2.8" fill="#5c3010" opacity="0.9"/>
  <ellipse cx="27" cy="19" rx="2.4" ry="2.4" fill="#5c3010" opacity="0.9"/>
