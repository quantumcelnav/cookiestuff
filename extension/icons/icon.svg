  <ellipse cx="15" cy="33" rx="2.4" ry="2.4" fill="#5c3010" opacity="0.9"/>
  <ellipse cx="24" cy="35" rx="2" ry="2" fill="#5c3010" opacity="0.9"/>
  <!-- Alert badge -->
  <circle cx="37" cy="11" r="10" fill="#1a1b26"/>
